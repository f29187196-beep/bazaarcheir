name = "bazaarcheir"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# دیتابیس D1
[[d1_databases]]
binding = "DB"
database_name = "bazaarcheir_db"
database_id = "439727ce-5461-40ca-8825-19bfd3336da9"

# متغیرهای محیطی (توکن ربات را در .dev.vars یا با wrangler secret ست کنید، نه اینجا)
# دستور برای ست کردن توکن به صورت امن:
#   wrangler secret put BOT_TOKEN

# اجرای خودکار هر ۱ دقیقه برای پاک کردن پیام‌های هشدار منقضی‌شده
[triggers]
crons = ["* * * * *"]
